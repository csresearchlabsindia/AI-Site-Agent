  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="600" fill="#15181c">ASA-01 · vision pipeline with SLAM  (DepthAI 3.10, single camera owner: asa-vision)</text>
  <text x="40" y="74" font-size="14" fill="#6b747e">Drawing ASA-SW-02 rev A</text>

