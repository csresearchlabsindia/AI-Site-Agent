  <g><rect x="1050" y="250" width="290" height="64" rx="6" fill="#ffffff" stroke="#30363d"/><text x="1195" y="276" font-size="13" text-anchor="middle" font-weight="600" fill="#15181c">Drive</text><text x="1195" y="296" font-size="12" text-anchor="middle" fill="#6b747e">arm · hold-to-drive · e-stop state</text></g>
