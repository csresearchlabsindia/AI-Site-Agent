  <g><rect x="220" y="160" width="130" height="64" rx="6" fill="#ffffff" stroke="#30363d"/><text x="285" y="186" font-size="13" text-anchor="middle" font-weight="600" fill="#15181c">CAM_C  right</text><text x="285" y="206" font-size="12" text-anchor="middle" fill="#6b747e">OV9282 · 640×400</text></g>
  <g><rect x="60" y="260" width="290" height="72" rx="6" fill="#ffffff" stroke="#30363d"/><text x="205" y="286" font-size="13" text-anchor="middle" font-weight="600" fill="#15181c">StereoDepth</text><text x="205" y="306" font-size="12" text-anchor="middle" fill="#6b747e">LR-check · depth aligned to CAM_A</text><text x="205" y="322" font-size="12" text-anchor="middle" fill="#6b747e">out 512×288 @ 8 fps · uint16 mm</text></g>
  <g><rect x="60" y="370" width="290" height="64" rx="6" fill="#ffffff" stroke="#30363d"/><text x="205" y="396" font-size="13" text-anchor="middle" font-weight="600" fill="#15181c">CAM_A  colour</text><text x="205" y="416" font-size="12" text-anchor="middle" fill="#6b747e">IMX378 · 512×288 @ 8 fps · GRAY8 + BGR</text></g>
  <g><rect x="60" y="470" width="290" height="64" rx="6" fill="#ffffff" stroke="#30363d"/><text x="205" y="496" font-size="13" text-anchor="middle" font-weight="600" fill="#15181c">SpatialDetectionNetwork ×2</text><text x="205" y="516" font-size="12" text-anchor="middle" fill="#6b747e">hardhat (512×288) · YOLOv6n person</text></g>
  <g><rect x="60" y="570" width="290" height="64" rx="6" fill="#ffffff" stroke="#9aa3ad" stroke-dasharray="5 4"/><text x="205" y="596" font-size="13" text-anchor="middle" font-weight="600" fill="#6b747e">IMU  BNO086</text><text x="205" y="616" font-size="12" text-anchor="middle" fill="#9aa3ad">200 Hz · ASA_SLAM_IMU=0 (off)</text></g>

