  <g><rect x="470" y="290" width="220" height="86" rx="6" fill="#ffffff" stroke="#2F6FD6" stroke-width="1.5"/><text x="580" y="316" font-size="13" text-anchor="middle" font-weight="600" fill="#15181c">RTABMapVIO</text><text x="580" y="336" font-size="12" text-anchor="middle" fill="#6b747e">rect GRAY8 + depth</text><text x="580" y="356" font-size="12" text-anchor="middle" fill="#6b747e">pose x y yaw · vision-only</text></g>
  <g><rect x="710" y="290" width="220" height="86" rx="6" fill="#ffffff" stroke="#2F6FD6" stroke-width="1.5"/><text x="820" y="316" font-size="13" text-anchor="middle" font-weight="600" fill="#15181c">RTABMapSLAM</text><text x="820" y="336" font-size="12" text-anchor="middle" fill="#6b747e">2-D occupancy grid · 5 cm</text><text x="820" y="356" font-size="12" text-anchor="middle" fill="#6b747e">range 0.3–4 m · 0.5 Hz</text></g>
