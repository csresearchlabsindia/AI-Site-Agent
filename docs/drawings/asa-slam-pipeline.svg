  <g><rect x="470" y="550" width="460" height="86" rx="6" fill="#ffffff" stroke="#30363d"/><text x="700" y="576" font-size="13" text-anchor="middle" font-weight="600" fill="#15181c">Map renderer · 1 Hz</text><text x="700" y="596" font-size="12" text-anchor="middle" fill="#6b747e">grid 0 free · 89 unknown · 178 occupied</text><text x="700" y="616" font-size="12" text-anchor="middle" fill="#6b747e">robot drawn as heading arrow</text></g>

